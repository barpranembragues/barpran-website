name: Scrape ACTC pilot photos

on:
  push:
    paths:
      - ".github/workflows/scrape-actc-pilotos.yml"
      - "scripts/scrape_actc_pilotos.py"
  pull_request:
    paths:
      - ".github/workflows/scrape-actc-pilotos.yml"
      - "scripts/scrape_actc_pilotos.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Scrape ACTC photos
        run: python scripts/scrape_actc_pilotos.py

      - name: Show downloaded files
        run: |
          find public/pilotos -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true

      - name: Upload scraped photos
        uses: actions/upload-artifact@v4
        with:
          name: actc-pilot-photos
          path: public/pilotos
          if-no-files-found: warn

      - name: Commit pilot photos
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "barpran-bot"
          git config user.email "admin@barpran.com"
          git add public/pilotos
          if git diff --cached --quiet; then
            echo "No new pilot photos downloaded"
            exit 0
          fi
          git commit -m "Agrega fotos oficiales ACTC de pilotos [skip actc]"
          git push origin HEAD:${TARGET_BRANCH}
