name: Temp scrape Bonelli ACTC

on:
  push:
    branches:
      - tmp-actc-bonelli-reference
    paths:
      - '.github/workflows/tmp-scrape-bonelli.yml'
      - 'scripts/tmp_scrape_bonelli.py'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - run: python scripts/tmp_scrape_bonelli.py
      - run: |
          git config user.name 'barpran-bot'
          git config user.email 'admin@barpran.com'
          git add public/pilotos/nicolas-bonelli.png
          if git diff --cached --quiet; then
            echo 'No image downloaded'
            exit 1
          fi
          git commit -m 'Agrega referencia ACTC Nicolas Bonelli'
          git push origin HEAD:tmp-actc-bonelli-reference
