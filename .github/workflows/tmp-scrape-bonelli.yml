name: Temp build BARPRAN ACTC story

on:
  push:
    branches:
      - tmp-actc-bonelli-reference
    paths:
      - '.github/workflows/tmp-scrape-bonelli.yml'
      - 'scripts/tmp_scrape_bonelli.py'
      - 'scripts/tmp_make_story.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Ensure official Bonelli portrait
        run: |
          if [ ! -f public/pilotos/nicolas-bonelli.png ]; then
            python scripts/tmp_scrape_bonelli.py
          fi
      - name: Build Instagram story
        run: python scripts/tmp_make_story.py
      - name: Commit result
        run: |
          git config user.name 'barpran-bot'
          git config user.email 'admin@barpran.com'
          git add public/pilotos/nicolas-bonelli.png public/barpran-trucco-bonelli-dianda-story.png
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Genera historia BARPRAN Trucco Bonelli Dianda'
          git push origin HEAD:tmp-actc-bonelli-reference
